name: Supabase migrations

on:
  push:
    branches:
      - main
    paths:
      - backend/supabase/migrations/**
      - .github/workflows/supabase-migrations.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production-migrations
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment: supabase-production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate migration connection secret
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$SUPABASE_DB_URL" ]]; then
            echo "::error::SUPABASE_DB_URL is not configured"
            exit 1
          fi
          if [[ ! "$SUPABASE_DB_URL" =~ ^postgres(ql)?://postgres\.[a-z0-9-]+:[^@]+@[a-z0-9-]+\.pooler\.supabase\.com:5432/postgres\?sslmode=require$ ]]; then
            echo "::error::SUPABASE_DB_URL must be the Supabase session pooler URL (port 5432, postgres database, sslmode=require)"
            exit 1
          fi
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Preview pending migration SQL
        run: supabase --workdir backend db push --db-url "$SUPABASE_DB_URL" --dry-run
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Apply reviewed migrations
        run: supabase --workdir backend db push --db-url "$SUPABASE_DB_URL" --yes
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
