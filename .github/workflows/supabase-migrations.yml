name: Supabase migrations

on:
  push:
    branches:
      - main
    paths:
      - backend/supabase/migrations/**
      - .github/workflows/supabase-migrations.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production-migrations
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment: supabase-production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate migration connection secret
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import os
          import re
          import sys
          from urllib.parse import parse_qsl, unquote, urlsplit

          value = os.environ.get("SUPABASE_DB_URL", "")
          error = "::error::SUPABASE_DB_URL must be a valid Supabase session pooler URL"

          try:
              parsed = urlsplit(value)
              if parsed.scheme not in {"postgres", "postgresql"}:
                  raise ValueError
              if parsed.hostname is None or not re.fullmatch(
                  r"[a-z0-9-]+\.pooler\.supabase\.com", parsed.hostname
              ):
                  raise ValueError
              if parsed.port != 5432 or parsed.path != "/postgres" or parsed.fragment:
                  raise ValueError
              if parsed.username is None or not re.fullmatch(
                  r"postgres\.[a-z0-9-]+", unquote(parsed.username)
              ):
                  raise ValueError
              if parsed.password is None or not parsed.password or re.search(
                  r"[@\s]|%(?![0-9a-fA-F]{2})", parsed.password
              ):
                  raise ValueError
              parameters = parse_qsl(parsed.query, keep_blank_values=True, strict_parsing=True)
              ssl_modes = [value for key, value in parameters if key == "sslmode"]
              if ssl_modes != ["require"]:
                  raise ValueError
          except (ValueError, UnicodeError):
              print(error, file=sys.stderr)
              sys.exit(1)
          PY
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Preview pending migration SQL
        run: supabase --workdir backend db push --db-url "$SUPABASE_DB_URL" --dry-run
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Apply reviewed migrations
        run: supabase --workdir backend db push --db-url "$SUPABASE_DB_URL" --yes
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
