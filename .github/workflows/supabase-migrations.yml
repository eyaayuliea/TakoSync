name: Supabase migrations

on:
  workflow_dispatch:
    inputs:
      confirm_development_target:
        description: Confirm this run targets the approved TakoSync Development project
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: supabase-development-migrations
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      inputs.confirm_development_target == true &&
      vars.TAKOSYNC_DEVELOPMENT_MIGRATIONS_APPROVED == 'true' &&
      vars.TAKOSYNC_MIGRATIONS_RECONCILED == 'true' &&
      vars.SUPABASE_DEVELOPMENT_PROJECT_REF != '' &&
      vars.SUPABASE_PRODUCTION_PROJECT_REF != ''
    environment: supabase-development
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate unique local migration versions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from collections import Counter
          from pathlib import Path
          import re
          import sys

          migration_dir = Path("backend/supabase/migrations")
          migrations = sorted(migration_dir.glob("*.sql"))
          versions = [re.match(r"^(\d{12})_", path.name) for path in migrations]
          invalid = [path.name for path, match in zip(migrations, versions) if match is None]
          counts = Counter(match.group(1) for match in versions if match)
          duplicates = sorted(version for version, count in counts.items() if count > 1)
          if invalid or duplicates:
              print("::error title=Migration source::Migration filenames must use unique 12-digit versions.")
              if invalid:
                  print("Invalid filenames: " + ", ".join(invalid))
              if duplicates:
                  print("Duplicate versions: " + ", ".join(duplicates))
              sys.exit(1)
          print(f"Validated {len(migrations)} uniquely versioned migration files.")
          PY

      - name: Validate migration connection secret
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import os
          import re
          import sys
          from urllib.parse import parse_qsl, unquote

          value = os.environ.get("SUPABASE_DB_URL", "")
          print(f"SUPABASE_DB_URL empty: {not value}")

          def fail(message):
              print(f"::error title=Secret configuration::{message}", file=sys.stderr)
              sys.exit(1)

          if not value:
              fail(
                  "SUPABASE_DB_URL is empty; configure the SUPABASE_DB_URL secret "
                  "in the supabase-development environment"
              )
          if any(character in value for character in "\r\n"):
              fail("SUPABASE_DB_URL contains an invalid line break")

          uri_match = re.fullmatch(
              r"(postgres|postgresql)://([^/?#]*)(/[^?#]*)?(?:\?([^#]*))?(?:#(.*))?",
              value,
          )
          if uri_match is None:
              fail("SUPABASE_DB_URL is not a valid PostgreSQL URI")

          scheme, authority, path, query, fragment = uri_match.groups()
          if fragment is not None:
              fail("SUPABASE_DB_URL must not contain a URI fragment")
          if "@" not in authority:
              fail("SUPABASE_DB_URL is missing database credentials")
          userinfo, hostport = authority.rsplit("@", 1)
          if ":" not in userinfo:
              fail("SUPABASE_DB_URL is missing a database password")
          username, password = userinfo.split(":", 1)
          if not username or not password:
              fail("SUPABASE_DB_URL has an empty database username or password")
          if not re.fullmatch(r"postgres\.[a-z0-9-]+", unquote(username)):
              fail("SUPABASE_DB_URL must use the Supabase postgres.<project-ref> user")
          development_ref = os.environ.get("SUPABASE_DEVELOPMENT_PROJECT_REF", "")
          production_ref = os.environ.get("SUPABASE_PRODUCTION_PROJECT_REF", "")
          if not re.fullmatch(r"[a-z0-9]{10,30}", development_ref):
              fail("SUPABASE_DEVELOPMENT_PROJECT_REF is missing or invalid")
          if not re.fullmatch(r"[a-z0-9]{10,30}", production_ref):
              fail("SUPABASE_PRODUCTION_PROJECT_REF is missing or invalid")
          if development_ref == production_ref:
              fail("The Development project reference must differ from Production")
          if unquote(username) != f"postgres.{development_ref}":
              fail("The database URL username does not match the approved Development project")
          if re.search(r"[\s@\[\]]|%(?![0-9a-fA-F]{2})", password):
              fail("SUPABASE_DB_URL contains invalid password encoding")
          if ":" not in hostport:
              fail("SUPABASE_DB_URL is missing a database port")
          hostname, port_text = hostport.rsplit(":", 1)
          hostname = hostname.lower()
          database = (path or "").removeprefix("/")
          if not re.fullmatch(r"[0-9]+", port_text):
              fail("SUPABASE_DB_URL has an invalid database port")
          try:
              port = int(port_text)
          except ValueError:
              fail("SUPABASE_DB_URL has an invalid database port")
          if re.search(r"%(?![0-9a-fA-F]{2})", query or ""):
              fail("SUPABASE_DB_URL contains invalid query encoding")

          try:
              parameters = parse_qsl(query or "", keep_blank_values=True)
          except (UnicodeError, ValueError):
              fail("SUPABASE_DB_URL has invalid query parameters")
          sslmode_values = [
              parameter.strip().lower()
              for key, parameter in parameters
              if key.strip().lower() == "sslmode"
          ]
          if sslmode_values and sslmode_values != ["require"]:
              fail("SUPABASE_DB_URL must use sslmode=require")
          sslmode_required = bool(sslmode_values)

          print("URL parsing succeeded: True")
          print(f"Parsed hostname: {hostname}")
          print(f"Parsed port: {port}")
          print(f"Parsed database: {database or '<unavailable>'}")
          print(f"sslmode=require present: {sslmode_required}")

          if not hostname.endswith(".pooler.supabase.com") or not re.fullmatch(
              r"[a-z0-9-]+", hostname[: -len(".pooler.supabase.com")]
          ):
              fail("SUPABASE_DB_URL must use a Supabase Session Pooler hostname")
          if port != 5432:
              fail("SUPABASE_DB_URL must use Session Pooler port 5432")
          if database != "postgres":
              fail("SUPABASE_DB_URL must use the postgres database")

          effective_url = value
          if not sslmode_required:
              effective_url += "&" if query else "?"
              effective_url += "sslmode=require"
          github_env = os.environ.get("GITHUB_ENV")
          if not github_env:
              fail("GitHub Actions environment file is unavailable")
          with open(github_env, "a", encoding="utf-8") as environment:
              environment.write(f"SUPABASE_DB_URL_EFFECTIVE={effective_url}\n")
          PY
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DEVELOPMENT_PROJECT_REF: ${{ vars.SUPABASE_DEVELOPMENT_PROJECT_REF }}
          SUPABASE_PRODUCTION_PROJECT_REF: ${{ vars.SUPABASE_PRODUCTION_PROJECT_REF }}

      - name: Validate remote migration ordering
        shell: bash
        run: |
          set -euo pipefail

          migration_history="$(
            supabase --workdir backend --output-format json \
              migration list --remote="$SUPABASE_DB_URL_EFFECTIVE"
          )"
          printf '%s' "$migration_history" | python -c '
          import json
          import sys

          try:
              history = json.load(sys.stdin)
              migrations = history["migrations"]
              applied = [row["remote"] for row in migrations if row.get("remote")]
              pending = [
                  row["local"] for row in migrations
                  if row.get("local") and not row.get("remote")
              ]
          except (KeyError, TypeError, json.JSONDecodeError):
              print("::error title=Migration history::Could not parse Supabase migration history")
              sys.exit(1)

          latest_applied = max(applied, default="")
          # 202611020004 was added after 202611040001 had already been applied.
          # Its database effects were checked, and 202611040002 restores the
          # business-session guard on the RPC that 020004 replaces.
          reviewed_late_migrations = {"202611020000", "202611020004"}
          unexpected_older = sorted(
              version for version in pending
              if version < latest_applied and version not in reviewed_late_migrations
          )
          if unexpected_older:
              print(
                  "::error title=Migration history::Unexpected unapplied migrations "
                  "precede the latest remote migration: "
                  + ", ".join(unexpected_older)
              )
              sys.exit(1)
          print("Remote migration history ordering is valid.")
          '

      - name: Preview pending migration SQL (database connectivity and migration preview)
        run: supabase --workdir backend db push --remote="$SUPABASE_DB_URL_EFFECTIVE" --include-all --dry-run

      - name: Apply migrations to the approved Development project
        run: supabase --workdir backend db push --remote="$SUPABASE_DB_URL_EFFECTIVE" --include-all --yes
