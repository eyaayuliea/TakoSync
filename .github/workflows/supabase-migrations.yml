name: Supabase migrations

on:
  push:
    branches:
      - main
    paths:
      - backend/supabase/migrations/**
      - .github/workflows/supabase-migrations.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production-migrations
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment: supabase-production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate migration connection secret
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import os
          import re
          import sys
          from urllib.parse import parse_qsl, unquote

          value = os.environ.get("SUPABASE_DB_URL", "")
          print(f"SUPABASE_DB_URL empty: {not value}")

          def fail(message):
              print(f"::error title=Secret configuration::{message}", file=sys.stderr)
              sys.exit(1)

          if not value:
              fail(
                  "SUPABASE_DB_URL is empty; configure the SUPABASE_DB_URL secret "
                  "in the supabase-production environment"
              )
          if any(character in value for character in "\r\n"):
              fail("SUPABASE_DB_URL contains an invalid line break")

          uri_match = re.fullmatch(
              r"(postgres|postgresql)://([^/?#]*)(/[^?#]*)?(?:\?([^#]*))?(?:#(.*))?",
              value,
          )
          if uri_match is None:
              fail("SUPABASE_DB_URL is not a valid PostgreSQL URI")

          scheme, authority, path, query, fragment = uri_match.groups()
          if fragment is not None:
              fail("SUPABASE_DB_URL must not contain a URI fragment")
          if "@" not in authority:
              fail("SUPABASE_DB_URL is missing database credentials")
          userinfo, hostport = authority.rsplit("@", 1)
          if ":" not in userinfo:
              fail("SUPABASE_DB_URL is missing a database password")
          username, password = userinfo.split(":", 1)
          if not username or not password:
              fail("SUPABASE_DB_URL has an empty database username or password")
          if not re.fullmatch(r"postgres\.[a-z0-9-]+", unquote(username)):
              fail("SUPABASE_DB_URL must use the Supabase postgres.<project-ref> user")
          if re.search(r"[\s@\[\]]|%(?![0-9a-fA-F]{2})", password):
              fail("SUPABASE_DB_URL contains invalid password encoding")
          if ":" not in hostport:
              fail("SUPABASE_DB_URL is missing a database port")
          hostname, port_text = hostport.rsplit(":", 1)
          hostname = hostname.lower()
          database = (path or "").removeprefix("/")
          if not re.fullmatch(r"[0-9]+", port_text):
              fail("SUPABASE_DB_URL has an invalid database port")
          try:
              port = int(port_text)
          except ValueError:
              fail("SUPABASE_DB_URL has an invalid database port")
          if re.search(r"%(?![0-9a-fA-F]{2})", query or ""):
              fail("SUPABASE_DB_URL contains invalid query encoding")

          try:
              parameters = parse_qsl(query or "", keep_blank_values=True)
          except (UnicodeError, ValueError):
              fail("SUPABASE_DB_URL has invalid query parameters")
          sslmode_values = [
              parameter.strip().lower()
              for key, parameter in parameters
              if key.strip().lower() == "sslmode"
          ]
          if sslmode_values and sslmode_values != ["require"]:
              fail("SUPABASE_DB_URL must use sslmode=require")
          sslmode_required = bool(sslmode_values)

          print("URL parsing succeeded: True")
          print(f"Parsed hostname: {hostname}")
          print(f"Parsed port: {port}")
          print(f"Parsed database: {database or '<unavailable>'}")
          print(f"sslmode=require present: {sslmode_required}")

          if not hostname.endswith(".pooler.supabase.com") or not re.fullmatch(
              r"[a-z0-9-]+", hostname[: -len(".pooler.supabase.com")]
          ):
              fail("SUPABASE_DB_URL must use a Supabase Session Pooler hostname")
          if port != 5432:
              fail("SUPABASE_DB_URL must use Session Pooler port 5432")
          if database != "postgres":
              fail("SUPABASE_DB_URL must use the postgres database")

          effective_url = value
          if not sslmode_required:
              effective_url += "&" if query else "?"
              effective_url += "sslmode=require"
          github_env = os.environ.get("GITHUB_ENV")
          if not github_env:
              fail("GitHub Actions environment file is unavailable")
          with open(github_env, "a", encoding="utf-8") as environment:
              environment.write(f"SUPABASE_DB_URL_EFFECTIVE={effective_url}\n")
          PY
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Preview pending migration SQL (database connectivity and migration preview)
        run: supabase --workdir backend db push --db-url "$SUPABASE_DB_URL_EFFECTIVE" --dry-run

      - name: Apply reviewed migrations (migration apply)
        run: supabase --workdir backend db push --db-url "$SUPABASE_DB_URL_EFFECTIVE" --yes
