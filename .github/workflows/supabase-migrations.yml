name: Supabase migrations

on:
  push:
    branches:
      - main
    paths:
      - backend/supabase/migrations/**
      - .github/workflows/supabase-migrations.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production-migrations
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment: supabase-production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Require Supabase deployment configuration
        env:
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "::error::Missing required environment variable SUPABASE_PROJECT_ID in supabase-production."
            exit 1
          fi
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Missing required environment secret SUPABASE_DB_URL in supabase-production."
            exit 1
          fi

      - name: Validate Supabase database connection target
        env:
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import sys
          from urllib.parse import urlparse

          project_id = os.environ["SUPABASE_PROJECT_ID"].strip()
          db_url = os.environ["SUPABASE_DB_URL"].strip()

          try:
            parsed = urlparse(db_url)
          except Exception:
            print("::error::SUPABASE_DB_URL is not a valid PostgreSQL connection URI.", file=sys.stderr)
            raise SystemExit(1)

          if parsed.scheme not in {"postgresql", "postgres"}:
            print("::error::SUPABASE_DB_URL must use the postgres:// or postgresql:// scheme.", file=sys.stderr)
            raise SystemExit(1)

          host = (parsed.hostname or "").lower()
          user = parsed.username or ""
          is_direct = host == f"db.{project_id}.supabase.co"
          is_pooler = host.endswith(".pooler.supabase.com")

          if not host:
            print("::error::SUPABASE_DB_URL must include a database host.", file=sys.stderr)
            raise SystemExit(1)
          if not parsed.password:
            print("::error::SUPABASE_DB_URL must include a database password.", file=sys.stderr)
            raise SystemExit(1)
          if parsed.path in {"", "/"}:
            print("::error::SUPABASE_DB_URL must include a database name.", file=sys.stderr)
            raise SystemExit(1)
          if not (is_direct or is_pooler):
            print(
              "::error::SUPABASE_DB_URL host must be the direct host db.<project-ref>.supabase.co or a Supabase pooler host (*.pooler.supabase.com).",
              file=sys.stderr,
            )
            raise SystemExit(1)
          if is_pooler and not user.endswith(f".{project_id}"):
            print(
              "::error::Pooler URLs must use the project-scoped database username format (for example postgres.<project-ref>).",
              file=sys.stderr,
            )
            raise SystemExit(1)
          if is_direct and user != "postgres":
            print(
              "::error::Direct database URLs must use the postgres role user.",
              file=sys.stderr,
            )
            raise SystemExit(1)
          PY

      - name: Preview pending migration SQL
        run: supabase --workdir backend db push --db-url "$SUPABASE_DB_URL" --dry-run
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Apply reviewed migrations
        run: supabase --workdir backend db push --db-url "$SUPABASE_DB_URL" --yes
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}