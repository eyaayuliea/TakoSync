name: Supabase migrations

on:
  push:
    branches:
      - main
    paths:
      - backend/supabase/migrations/**
      - .github/workflows/supabase-migrations.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production-migrations
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment: supabase-production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate migration connection secret
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import os
          import re
          import sys
          from urllib.parse import parse_qsl, unquote, urlsplit

          value = os.environ.get("SUPABASE_DB_URL", "")
          print(f"SUPABASE_DB_URL empty: {not value}")
          parsed = None
          try:
              parsed = urlsplit(value)
          except (ValueError, UnicodeError):
              print("URL parsing succeeded: False")
          else:
              print("URL parsing succeeded: True")

          try:
              hostname = parsed.hostname or "" if parsed is not None else ""
          except (ValueError, UnicodeError):
              hostname = ""
          try:
              port = parsed.port if parsed is not None else None
          except (ValueError, UnicodeError):
              port = None
          database = ""
          if parsed is not None:
              database = parsed.path.removeprefix("/")
          try:
              parameters = parse_qsl(
                  parsed.query if parsed is not None else "",
                  keep_blank_values=True,
              )
              sslmode_values = [
                  parameter for key, parameter in parameters if key == "sslmode"
              ]
          except (ValueError, UnicodeError):
              sslmode_values = []
          sslmode_required = sslmode_values == ["require"]

          print(f"Parsed hostname: {hostname or '<unavailable>'}")
          print(f"Parsed port: {port if port is not None else '<unavailable>'}")
          print(f"Parsed database: {database or '<unavailable>'}")
          print(f"sslmode=require present: {sslmode_required}")

          try:
              pooler_suffix = ".pooler.supabase.com"
              if parsed is None or parsed.scheme not in {"postgres", "postgresql"}:
                  raise ValueError
              if not hostname.endswith(pooler_suffix) or not re.fullmatch(
                  r"[a-z0-9-]+", hostname[: -len(pooler_suffix)]
              ):
                  raise ValueError
              if port != 5432 or database != "postgres" or parsed.fragment:
                  raise ValueError
              if parsed.username is None or not re.fullmatch(
                  r"postgres\.[a-z0-9-]+", unquote(parsed.username)
              ):
                  raise ValueError
              if parsed.password is None or not parsed.password or re.search(
                  r"[@\s]|%(?![0-9a-fA-F]{2})", parsed.password
              ):
                  raise ValueError
              if sslmode_values != ["require"]:
                  raise ValueError
          except (ValueError, UnicodeError):
              print(
                  "::error::SUPABASE_DB_URL must be a valid Supabase session pooler URL",
                  file=sys.stderr,
              )
              sys.exit(1)
          PY
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Preview pending migration SQL
        run: supabase --workdir backend db push --db-url "$SUPABASE_DB_URL" --dry-run
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Apply reviewed migrations
        run: supabase --workdir backend db push --db-url "$SUPABASE_DB_URL" --yes
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
